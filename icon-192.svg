<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Subtle glow -->
  <circle cx="150" cy="40" r="60" fill="#38bdf8" opacity="0.25" filter="blur(16px)" />

  <!-- Wallet Body -->
  <g transform="translate(36, 42)">
    <!-- Main Back Body -->
    <rect x="0" y="24" width="120" height="84" rx="18" fill="#ffffff" opacity="0.18" />
    <!-- Front Flap -->
    <rect x="0" y="32" width="120" height="76" rx="16" fill="#ffffff" opacity="0.95" />
    <path d="M0 48 Q 60 70 120 48" stroke="#e2e8f0" stroke-width="2.5" fill="none" opacity="0.4" />

    <!-- Clasp / Lock -->
    <rect x="76" y="56" width="38" height="28" rx="8" fill="url(#bgGrad)" />
    <circle cx="95" cy="70" r="5" fill="url(#goldGrad)" />

    <!-- Coin popping out -->
    <circle cx="60" cy="18" r="16" fill="url(#goldGrad)" />
    <text x="60" y="23" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" fill="#78350f" text-anchor="middle">Rp</text>
  </g>
</svg>

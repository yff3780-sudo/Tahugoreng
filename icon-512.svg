<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Subtle glow -->
  <circle cx="400" cy="100" r="160" fill="#38bdf8" opacity="0.3" filter="blur(36px)" />

  <!-- Wallet Body -->
  <g transform="translate(96, 112)">
    <!-- Main Back Body -->
    <rect x="0" y="64" width="320" height="224" rx="48" fill="#ffffff" opacity="0.18" />
    <!-- Front Flap -->
    <rect x="0" y="86" width="320" height="202" rx="42" fill="#ffffff" opacity="0.95" />
    <path d="M0 128 Q 160 186 320 128" stroke="#e2e8f0" stroke-width="6" fill="none" opacity="0.4" />

    <!-- Clasp / Lock -->
    <rect x="202" y="150" width="102" height="74" rx="22" fill="url(#bgGrad512)" />
    <circle cx="253" cy="187" r="14" fill="url(#goldGrad512)" />

    <!-- Coin popping out -->
    <circle cx="160" cy="48" r="42" fill="url(#goldGrad512)" />
    <text x="160" y="61" font-family="-apple-system, sans-serif" font-weight="900" font-size="42" fill="#78350f" text-anchor="middle">Rp</text>
  </g>
</svg>
